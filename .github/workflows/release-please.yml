name: Auto Release

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main,master
          tag_prefix: v

      - name: Update composer.json version
        if: steps.tag_version.outputs.new_tag != steps.tag_version.outputs.previous_tag
        run: |
          NEW_VERSION=${{ steps.tag_version.outputs.new_version }}
          echo "Updating composer.json to version $NEW_VERSION"
          
          # Use jq to update the version field safely
          jq ".version = \"$NEW_VERSION\"" composer.json > composer.tmp && mv composer.tmp composer.json
          
          # Commit the change
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add composer.json
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git push

      - name: Create a GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          token: ${{ secrets.GITHUB_TOKEN }}
